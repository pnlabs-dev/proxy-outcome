[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proxy-outcome"
version = "0.1.0"
description = "Deterministic HTTP and network outcome classification for scraping and web retrieval workloads."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "PN Labs"}]
keywords = ["proxy", "scraping", "http", "observability", "reliability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
proxy-outcome = "proxy_outcome.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
